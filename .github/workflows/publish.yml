name: Publish site to gh-pages
on:
  push:
    branches: [main]
    paths: ["pack/**", ".github/workflows/publish.yml"]
  workflow_dispatch:
permissions:
  contents: write
concurrency:
  group: publish
  cancel-in-progress: true
jobs:
  publish:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Unpack site
        run: |
          cat pack/site.tar.b64.part* > site.tar.b64
          echo "4e217b6deadc6fecb5129de8677a7e3cade6a18213d3c578f540e714fff5ff43  site.tar.b64" | sha256sum -c -
          mkdir _site
          base64 -d site.tar.b64 | tar -x -C _site
          touch _site/.nojekyll
          ls -la _site
      - name: Push to gh-pages
        run: |
          cd _site
          git init -b gh-pages
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add -A
          git commit -m "Publish site from ${GITHUB_SHA}"
          git push --force "https://x-access-token:${{ secrets.GITHUB_TOKEN }}@github.com/${GITHUB_REPOSITORY}.git" gh-pages
